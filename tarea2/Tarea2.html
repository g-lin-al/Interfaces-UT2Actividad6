
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Tarea 2</title>
    <link rel="stylesheet" href="./estilos/Tarea2.css">

</head>

<body>

    <form action="#" method="get">

        <img src="./imagenes/logo_peña.png" alt="Logo Peña Los Churreros">

        <h2>Registro a la peña Los Churreros</h2>

        <div class="campo">
            <label for="nombre">Nombre y apellidos</label>
            <input type="text" id="nombre" required placeholder="Introduce tu nombre y apellidos">
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" required placeholder="ejemplo@correo.com">
        </div>

        <div class="campo">
            <label for="dinerito">Aporte económico a la peña (Entre 100 € y 300 €)</label>
            <input type="number" id="dinerito" min="100" max="300" required>
        </div>

        <div class="campo">
            <label for="comentarios">Comentarios</label>
            <textarea id="comentarios" optional rows="4" placeholder="Escribe aquí cualquier duda que tengas sobre tu inscripción..."></textarea>
        </div>

        <div class="campo opciones">
            <label>
                <input type="checkbox" required>
                Acepto los terminos y condiciones
            </label>
        </div>

        <button type="submit">Registrarse</button>

    </form>

</body>
</html>
